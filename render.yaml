services:
  - type: web
    name: gridscope-api-yigedashuaige
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install --no-cache-dir --only-binary=numpy,scipy,pandas -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
